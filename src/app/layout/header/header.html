<header class="w-full border-b border-slate-200 bg-slate-50">
  <div class="mx-auto flex items-center justify-between px-4 py-3">
    <div class="text-base font-semibold tracking-tight text-slate-800">
      {{ techpoc }}
    </div>

    <!-- buscador-->
    @if (showSearch()) {
      <input
        class="border-gray-300 bg-gray-200 border rounded-lg px-3 py-2 text-smhover:border-gray-400 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
        type="text"
        placeholder="Buscar..."
      />
    }

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="rounded-full px-4 py-1.5 text-sm font-medium transition"
        [ngClass]="
          isActive('es') ? 'bg-blue-600 text-white' : 'bg-white text-slate-700 hover:bg-slate-100'
        "
      >
        ES
      </button>
      <button
        type="button"
        class="rounded-full px-4 py-1.5 text-sm font-medium transition"
        [ngClass]="
          isActive('en') ? 'bg-blue-600 text-white' : 'bg-white text-slate-700 hover:bg-slate-100'
        "
      >
        EN
      </button>
    </div>
    <div>
      <!-- logout -->
      @if (authStore.isAuthenticated()) {
        <button class="text-black-500 text-sm flex items-center gap-1" (click)="logout()">
          ⎋ Salir
        </button>
      }
    </div>
  </div>
</header>
