@if (modal.modalData(); as data) {
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-lg p-6 w-420px">
      <h2 class="text-lg font-semibold mb-2">
        {{ data.title | translate }}
      </h2>

      <p class="text-gray-600 text-sm mb-6">
        {{ data.message | translate }}
      </p>

      <div class="flex justify-end gap-3">
        <button
          (click)="modal.close()"
          class="px-4 py-2 rounded-md border border-gray-300 text-sm hover:bg-gray-100"
        >
          {{ data.cancelText || 'BUTTON.CANCEL' | translate }}
        </button>

        <button
          (click)="confirm()"
          [ngClass]="data.confirmButtonClass || 'hover:bg-red-700 bg-red-300'"
          class="px-4 py-2 rounded-md text-white text-sm"
        >
          {{ data.confirmText || 'BUTTON.ACEPT' | translate }}
        </button>
      </div>
    </div>
  </div>
}
