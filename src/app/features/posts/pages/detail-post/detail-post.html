@if (store.selectedPost(); as post) {
  <div class="max-w-3xl mx-auto py-10">
    <!-- header -->
    <div class="flex justify-between items-start mb-6">
      <h1 class="text-3xl font-bold">
        {{ post.title }}
      </h1>

      <div class="flex gap-2">
        <button class="bg-blue-600 text-white px-3 py-1.5 rounded-md text-sm hover:bg-blue-700">
          Editar
        </button>

        <button
          (click)="openDeleteModal()"
          class="bg-red-100 text-red-600 px-3 py-1.5 rounded-md text-sm hover:bg-red-200"
        >
          Eliminar
        </button>
      </div>
    </div>

    <!-- body -->
    <p class="text-gray-700 leading-relaxed mb-10">
      {{ post.body }}
    </p>

    <!-- comentarios -->
    <div class="mt-10">
      <h3 class="text-sm font-semibold text-gray-500 mb-4">COMENTARIOS</h3>

      @defer (on viewport) {
        <app-comments-list [postId]="store.selectedPost()?.id" />
      } @placeholder {
        <p class="text-gray-400">Loading comments section...</p>
      }
    </div>
  </div>
}
<!--TODO: hacer uno general-->
@if (showDeleteModal()) {
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-lg p-6 w-420px">
      <h2 class="text-lg font-semibold mb-2">Eliminar post</h2>

      <p class="text-gray-600 text-sm mb-6">
        ¿Seguro que quieres eliminar este post? Esta acción no se puede deshacer.
      </p>

      <div class="flex justify-end gap-3">
        <button
          (click)="closeDeleteModal()"
          class="px-4 py-2 rounded-md border border-gray-300 text-sm hover:bg-gray-100"
        >
          Cancelar
        </button>

        <button
          (click)="confirmDelete()"
          class="px-4 py-2 rounded-md bg-red-600 text-white text-sm hover:bg-red-700"
        >
          Eliminar
        </button>
      </div>
    </div>
  </div>
}
