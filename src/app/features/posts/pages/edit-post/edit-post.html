<div class="max-w-3xl mx-auto px-6 py-10">
  <!-- header -->
  <div class="mb-8">
    <h1 class="text-2xl font-semibold text-gray-900">{{ 'FORM_POST.EDIT' | translate }}</h1>

    <p class="text-sm text-gray-500 mt-1">{{ 'FORM_POST.NEW' | translate }}</p>
  </div>

  @if (loading()) {
    <div class="text-center py-10 text-gray-500">{{ 'STATE.LOADING' | translate }}</div>
  }

  @if (!loading()) {
    <!-- formulario -->
    <div class="bg-white rounded-lg">
      <app-post-form (submitPostUpdate)="updatePost($event)" (cancelPost)="goBack()" />
    </div>
  }
</div>
